# Liquidity Wall Bot - reference defaults (FOR DOCUMENTATION ONLY)
#
# The live configuration is edited inside Bookmap (add-on settings panel) and is
# persisted by Bookmap per instrument. This file just documents the defaults and
# what each parameter means; it is not read by the add-on.
#
# Distances are in PRICE DOLLARS (chart price units) and converted to ticks at
# runtime using the instrument tick size. For Gold (GC): tick 0.10, $100/point.

# --- master switches ---
enableTrading=false          # false = shadow mode (logs trades, sends no orders)
magnetMode=true              # true = trade toward the wall (the "opposite" play)
drawWallsOnChart=true

# --- wall detection ---
wallMinSize=47               # min clustered contracts to count as a wall (strong walls only)
wallBreakSizeFraction=0.5    # confirmed wall breaks only when size < wallMinSize*this (hysteresis)
wallRemoveGraceMs=1500       # keep a wall this long after last seen (ride out flicker)
maxTradesPerWall=2           # cap entries on a single wall while it stays confirmed
wallDominanceRatio=3.0       # wall size must be >= this x the avg level size around it
wallNeighborhoodTicks=50     # dominance judged vs avg of levels within +/-50 ticks ($5 on GC)
wallClusterTicks=3           # merge adjacent heavy levels within N ticks
wallPersistenceMs=1500       # wall must hold this long before trusted (anti-spoof)
maxWallDistanceDollars=30.0  # ignore walls farther than this from price

# --- sizing & risk ---
orderSize=1
takeProfitDollars=4.0        # target distance from entry  (~40 ticks / ~$400 on GC)
stopLossDollars=15.0         # stop distance from entry     (~150 ticks / ~$1500 on GC)

# --- wave / anti-trap ---
waveMinAmplitudeDollars=8.0          # required pull-back size before entering
minEntryDistanceFromWallDollars=6.0  # enter no closer than this to the wall
maxEntryDistanceFromWallDollars=25.0 # enter no farther than this from the wall
turnConfirmDollars=1.0               # price must turn back this much toward the wall

# --- smart peak filter (sniper) ---
peakFilterEnabled=true               # skip shorts into a fresh runaway breakout high (and vice-versa)
peakLookbackMs=900000                # window of recent pivots used to judge "established" vs breakout
pivotReversalDollars=3.0             # a peak/trough is recorded once price reverses this much from it
peakBreakoutToleranceDollars=1.5     # turn within this of the recent extreme = ok; beyond = breakout (skip)

# --- spoof-wall filter ---
spoofFilterEnabled=true              # blacklist levels whose walls keep confirming then pulling
spoofPullCount=2                     # this many recent "pulled" breaks near a level = spoof
spoofWindowMs=600000                 # pulls older than this no longer count (10 min)
spoofToleranceTicks=5                # pulls within +/- this many ticks count as the same level

# --- same-zone re-entry guard ---
reentryDeeperExtremeEnabled=true     # 2nd entry on same wall must start from a deeper trough/peak
reentryMinExtremeAdvanceDollars=1.0  # new extreme must beat the previous entry's extreme by this
reentryMemoryMs=3600000              # forget a previous entry's extreme after 1 hour

# --- revenge engine (post-stop recovery) ---
revengeEnabled=true                  # after a stop-out, take one recovery trade in the same direction
revengeMaxAttempts=1                 # max recovery trades per stop-out event
revengeMinExcursionDollars=3.0       # adverse journey (from the stopped trade's ENTRY) must be at least this
revengeReversalDollars=2.5           # price must correct back this much from the extreme before entry fires
revengeWindowMs=1200000              # stop looking for a recovery this long after the stop (20 min)

# --- pacing ---
cooldownMsAfterTrade=5000
postTradeTrackingMs=60000    # keep recording price this long after a trade closes
detectionThrottleMs=100      # min gap between full wall re-scans
